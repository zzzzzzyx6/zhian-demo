">${[['all','全部状态'],['running','演练中'],['done','已完成'],['paused','已暂停'],['stopped','已终止']].map(([v,l])=>`<option value="${v}" ${X.filter===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="search-box">${I('search',14)}<input id="attack-search" placeholder="搜索任务名称、模型或编号" value="${E(X.query)}" oninput="App.attack.search(this.value)"></div></div><div class="table-wrap"><table><thead><tr><th>演练任务</th><th>被测对象</th><th>攻击场景</th><th>任务状态</th><th>攻击成功率</th><th>操作</th></tr></thead><tbody id="attack-task-rows">${X.taskRows(rows)}</tbody></table></div><div class="table-foot"><div class="pagination"><span>‹</span><span class="page-number">1</span><span>›</span></div></div></div>`},

 search(v){X.query=v;const rows=X.db.tasks.filter(t=>(X.filter==='all'||t.status===X.filter)&&(t.name+X.targetFor(t).name+t.id).toLowerCase().includes(v.toLowerCase()));document.getElementById('attack-task-rows').innerHTML=X.taskRows(rows);},
 riskDistribution(){const values=scenarios.slice(0,4).map(s=>({s,count:X.db.tasks.reduce((n,t)=>n+t.units.filter(u=>u.scene===s.id&&u.result==='breach').length,0)})),max=Math.max(1,...values.map(v=>v.count));return `<div class="attack-severity-bars" style="gap:15px;margin-top:6px">${values.map((v,i)=>`<div class="attack-severity-row" style="font-size:10px;grid-template-columns:90px 1fr 25px"><span style="color:#64748b">${v.s.name}</span><div class="progress-track" style="height:7px;background:#e2e8f0"><div class="progress-fill" style="width:${v.count/max*100}%;background:${['#64748b','#64748b','#94a3b8','#cbd5e1'][i]}"></div></div><span class="muted">${v.count}</span></div>`).join('')}</div>`},

 progress(t,m){const idx=t.status==='done'?5:m.done===0?1:m.pct>92?3:2;const completed=t.units.filter(u=>u.result!=='pending');return `<div class="attack-pipeline">${[['配置校验','对象能力与场景匹配'],['生成攻击','按场景准备测试输入'],['执行与迭代','收集回应，持续优化'],['独立评价','按批次判断安全边界'],['汇总报告','汇总风险与加固建议']].map(([n,d],i)=>`<div class="attack-stage ${i===idx?'active':''}"><div class="stage-num">${i<idx?'✓ 已完成':i===idx?(t.status==='stopped'?'■ 已终止':t.status==='paused'?'Ⅱ 已暂停':'● 进行中'):'0'+(i+1)}</div><h4>${n}</h4><p>${d}</p></div>`).join('')}</div><div class="split"><div class="card"><div class="card-head"><div class="card-title">场景执行进度</div><span class="small-text muted">${m.pct}% 已完成</span></div><div class="card-body">${t.scenes.map(id=>{const units=t.units.filter(u=>u.scene===id),done=units.filter(u=>u.result!=='pending').length;return `<div class="attack-scenebar"><div class="flex"><strong>${X.scene(id).name}</strong><span class="muted">${done} / ${units.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${done/units.length*100}%"></div></div><div class="flex" style="margin-top:7px;margin-bottom:0;color:#64748b;font-size:9px"><span>${X.taskMethods(t,id).join(' · ')}</span><span>${done===units.length?'已完成':t.status==='stopped'?'已终止':t.status==='paused'?'已暂停':done?'正在演练':'排队中'}</span></div></div>`}).join('')}<p class="hint" style="margin-top:16px">执行与最终评价按批次交替进行攻击成功率仅按已完成有效评价计算</p></div></div><div class="card"><div class="card-head"><div class="card-title"><span class="live-dot"></span>实时事件</div><span class="mini-tag">模拟流</span></div><div class="card-body" style="padding-top:9px">${completed.slice(-5).reverse().map((u,i)=>`<div class="attack-event"><time>${String(10+Math.floor(u.index/60)).padStart(2,'0')}:${String(u.index%60).padStart(2,'0')}</time><span class="attack-event-dot"></span><div><strong>${u.method} · ${u.id}</strong><p>${u.result==='error'?'服务响应超时，已记录执行异常':u.result==='breach'?'最终评价：发现回答边界被突破':'最终评价：模型守住回答边界'}</p></div></div>`).join('')||'<div class="e  render(){const def=definitions[A.page],host=document.getElementById('center-sidebar'),app=document.getElementById('app');app.classList.toggle('has-center-nav',!!def);app.classList.toggle('nav-collapsed',!!A.data.ui?.sidebarCollapsed);document.querySelector(def?'.top-actions':'.standalone-left').appendChild(document.getElementById('workspace-return'));if(!def){host.innerHTML='';return;}const current=A.centers.current(),item=(def.sections||[{items:def.items}]).flatMap(s=>s.items).find(n=>n[0]===current);host.innerHTML=`<div class="center-brand"><span class="center-mobile-mark">${I(def.icon,22)}</span><strong>${def.name}</strong><button id="center-toggle" class="center-toggle" onclick="App.centers.toggle()" aria-controls="center-navigation" aria-expanded="${!A.data.ui?.sidebarCollapsed}" aria-label="${A.data.ui?.sidebarCollapsed?'展开侧边栏':'收起侧边栏'}" title="${A.data.ui?.sidebarCollapsed?'展开侧边栏':'收起侧边栏'}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div><nav id="center-navigation" aria-label="${def.name}">${A.page==='attack'?`<button class="center-create ${current==='create'?'active':''}" onclick="App.attack.newTask()" aria-label="新建攻防任务" title="新建攻防任务">${I('plus',19)}<span>新建攻防任务</span></button>`:''}${(def.sections||[{title:'工作台',items:def.items}]).map(sec=>`<div class="center-section">${E(sec.title)}</div>${sec.items.map(([id,name,desc,icon])=>{const count=A.centers.count(id);return `<button class="center-nav-item ${current===id?'active':''}" onclick="App.centers.go('${id}')" aria-label="${name}" title="${name} · ${desc}" ${current===id?'aria-current="page"':''}><span class="center-nav-icon">${I(icon,17)}</span><span class="center-nav-text"><strong>${name}</strong><small>${desc}</small></span>${count?`<span class="center-nav-count">${count}</span>`:''}</button>`;}).join('')}`).join('')}</nav><div class="center-sidebar-bottom"><button id="center-user-button" onclick="App.centers.accountToggle()" class="center-account" aria-label="安全管理员" aria-expanded="false"><span class="avatar">安</span><span class="center-account-text"><strong>安全管理员</strong></span><span class="account-chevron">›</span></button><div id="center-user-menu" class="center-user-menu" hidden><button onclick="App.navigate('workspace')">${I('grid',14)}<span>回到首页</span></button></div></div>`;document.getElementById('current-crumb').innerHTML=`<span>${def.name}</span><span class="center-crumb-slash">/</span><strong>${E(item?.[1]||(current==='create'?'新建攻防任务':'工作台'))}</strong>`;document.title=`${item?.[1]||(current==='create'?'新建攻防任务':def.name)} · ${def.name}`;app.dataset.section=current;}
};
document.addEventListener('click',e=>{if(e.target.closest?.('.center-sidebar-bottom'))return;const m=document.getElementById('center-user-menu');if(m)m.hidden=true;document.getElementById('center-user-button')?.setAttribute('aria-expanded','false');});

};
App.confirmResetDemo = function () {
  try { localStorage.removeItem('zhian-standalone-attack'); location.hash = 'workspace'; location.reload(); }
  catch (e) { App.toast('浏览器不允许清理本地存储，请重新打开页面'); }
};
