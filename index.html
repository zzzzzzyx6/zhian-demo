#app .main-content{max-width:1380px;padding:30px 44px 40px;margin:0 auto}
#app .standalone-topbar{height:74px;padding:0 36px;background:#ffffffed}
.standalone-left{display:flex;align-items:center;gap:22px;min-width:0}

.standalone-brand .brand-mark{width:33px;height:37px}
.standalone-brand .brand-name{display:block;font-size:20px;letter-spacing:3px;line-height:1.2}
.standalone-brand .brand-sub{display:block;font-size:8px;letter-spacing:1.8px;margin-top:4px}
.standalone-divider{height:25px;width:1px;background:#e2e8f0}
.standalone-context{font-size:12px;color:#475569;white-space:nowrap}

#app .workspace-return:hover{color:#2563eb;background:#f1f5f9}
#app .workspace-help{font-size:10px;color:#64748b;gap:6px;padding:4px}
