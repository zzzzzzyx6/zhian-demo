R.saveSample=function(){const r=R.db.records.find(r=>r.id===R.collectId),note=document.getElementById('sample-note').value.trim(),expected=document.getElementById('sample-expected').value;if(!note){document.getElementById('sample-error').textContent='请填写标注说明';return;}const existing=R.db.samples.find(s=>s.sourceId===r.id);const sample={id:existing?.id||'GS-'+Date.now().toString(36),node:r.node,text:r.text,expected,category:r.hits.join('、')||'待确认',note,source:r.requestId,sourceId:r.id};if(existing)Object.assign(existing,sample);else R.db.samples.push(sample);R.db.regression=null;A.save();A.closeModal();R.view='samples';A.render();A.toast('样本已保存，历史审核处置保持不变');};
R.samplesHTML=function(){return `<section class="card"><div class="card-head"><h3>治理样本 <span class="mini-tag">${R.db.samples.length}</span></h3><button class="btn small" onclick="App.review.setTab('rules')">验证规则</button></div><div class="table-wrap"><table><thead><tr><th>样本内容</th><th>审核节点</th><th>预期处置</th><th>来源 / 标注</th><th>操作</th></tr></thead><tbody>${R.db.samples.map(s=>`<tr><td class="guard-excerpt">${E(s.text)}</td><td>${stage(s.node)}</td><td>${A.badge(s.expected==='block'?'应拦截':'应放行',s.expected==='block'?'orange':'blue')}</td><td>${E(s.note||s.source)}</td><td><button class="link-btn" onclick="App.review.editSample('${s.id}')">调整标注</button></td></tr>`).join('')}</tbody></table></div></section>`;};
R.editSample=function(id){const s=R.db.samples.find(s=>s.id===id);R.editSampleId=id;A.modal('调整样本标注',`<pre class="range-inspect">${E(s.text)}</pre><div class="field"><label for="sample-edit-expected">预期处置</label><select id="sample-edit-expected"><option value="block" ${s.expected==='block'?'selected':''}>应拦截</option><option value="pass" ${s.expected==='pass'?'selected':''}>应放行</option></select></div><div class="field"><label for="sample-edit-note">标注说明 *</label><textarea id="sample-edit-note">${E(s.note||'')}</textarea></div><p id="sample-edit-error" class="error-message"></p>`,`<button class="btn" onclick="App.closeModal()">取消</button><button class="btn primary" onclick="App.review.updateSample()">保存</button>`);};
R.updateSample=function(){const note=document.getElementById('sample-edit-note').value.trim();if(!note){document.getElementById('sample-edit-error').textContent='请填写标注说明';return;}Object.assign(R.db.samples.find(s=>s.id===R.editSampleId),{note,expected:document.getElementById('sample-edit-expected').value});R.db.regression=null;A.save();A.closeModal();A.render();};
R.fingerprint=()=>JSON.stringify([R.db.draft,R.db.samples]);
R.regress=function(){const rows=R.db.samples.map(s=>{const decision=R.evaluate(s.text,s.node,R.db.draft),actual=decision.action==='block'?'block':'pass';return {id:s.id,text:s.text,node:s.node,expected:s.expected,actual,pass:s.expected===actual};});R.db.regression={signature:R.fingerprint(),rows,time:Date.now()};A.save();A.render();};
R.canPublish=()=>!!R.db.regression&&R.db.regression.signature===R.fingerprint()&&R.db.regression.rows.length>0&&R.db.regression.rows.every(r=>r.pass)&&JSON.stringify(R.db.draft)!==JSON.stringify(R.activeRules());
R.publish=function(){if(!R.canPublish()){A.toast('请先修改规则并通过当前样本集的回归测试');return;}const version=Math.max(...R.db.versions.map(v=>v.version))+1;R.db.versions.push({version,time:Date.now(),rules:copy(R.db.draft),note:`回归通过 ${R.db.regression.rows.length} / ${R.db.regression.rows.length}`,regression:copy(R.db.regression)});R.db.active=version;R.db.audit.unshift({time:Date.now(),action:'发布',version});A.save();A.render();A.toast('已发布规则 v'+version+'，仅影响后续模拟请求');};
R.rollback=function(version){if(!R.db.versions.some(v=>v.version===version))return;R.db.active=version;R.db.audit.unshift({time:Date.now(),action:'回退',version});A.save();A.render();A.toast('已切换到 v'+version+'，草稿与历史记录已保留');};
R.editRule=function(id){const r=R.db.draft.find(r=>r.id===id);R.editRuleId=id;A.modal('编辑规则草稿',`<h3>${E(r.name)}</h3><div class="field"><label for="rule-keywords">匹配词，每行一个 *</label><textarea id="rule-keywords" rows="4">${E(r.keywords.join('\n'))}</textarea></div><div class="field"><label>审核节点</label><label class="inline-check"><input id="rule-input" type="checkbox" ${r.nodes.includes('INPUT')?'checked':''}>用户输入 Query</label><label class="inline-check"><input id="rule-output" type="checkbox" ${r.nodes.includes('OUTPUT')?'checked':''}>模型输出 Response</label></div><div class="field"><label for="rule-action">命中动作</label><select id="rule-action"><option value="block" ${r.action==='block'?'selected':''}>拦截</option><option value="observe" ${r.action==='observe'?'selected':''}>仅记录，不阻断</option></select></div><label class="inline-check"><input id="rule-enabled" type="checkbox" ${r.enabled?'checked':''}>启用规则</label><p id="rule-error" class="error-message"></p>`,`<button class="btn" onclick="App.closeModal()">取消</button><button class="btn primary" onclick="App.review.saveRule()">保存草稿</button>`);};
R.saveRule=function(){const keywords=[...new Set(document.getElementById('rule-keywords').value.split('\n').map(s=>s.trim()).filter(Boolean))],nodes=[...(document.getElementById('rule-input').checked?['INPUT']:[]),...(document.getElementById('rule-output').checked?['OUTPUT']:[])];if(!keywords.length||!nodes.length){document.getElementById('rule-error').textContent='至少填写一个匹配词并选择一个审核节点';return;}Object.assign(R.db.draft.find(r=>r.id===R.editRuleId),{keywords,nodes,action:document.getElementById('rule-action').value,enabled:document.getElementById('rule-enabled').checked});R.db.regression=null;A.save();A.closeModal();A.render();A.toast('草稿已保存，发布前不会影响审核');};
R.viewVersion=function(version){const v=R.db.versions.find(v=>v.version===version);if(!v)return;A.drawer('规则版本 v'+version,`<div class="table-wrap"><table><thead><tr><th>规则</th><th>范围</th><th>匹配词</th><th>动作</th></tr></thead><tbody>${v.rules.map(r=>`<tr><td>${E(r.name)} ${r.enabled?'':'（停用）'}</td><td>${r.nodes.map(stage).join('<br>')}</td><td>${E(r.keywords.join('、'))}</td><td>${r.action==='block'?'拦截':'仅记录'}</td></tr>`).join('')}</tbody></table></div><p>${E(v.note)}</p>`,`<button class="btn" onclick="App.closeDrawer()">关闭</button>`);};
R.rulesHTML=function(){const d=R.db,test=d.regression,valid=test?.signature===R.fingerprint();return `<div class="guard-rule-status"><span>当前使用 ${A.badge('v'+d.active,'blue')}</span><span>检测方式：关键词流程模拟</span></div><section class="card"><div class="card-head"><h3>规则草稿</h3><div class="flex"><button class="btn small" onclick="App.review.regress()">运行回归测试</button><button class="btn primary small" ${R.canPublish()?'':'disabled'} onclick="App.review.publish()">发布版本</button></div></div><div class="table-wrap"><table><thead><tr><th>风险类别</th><th>范围</th><th>匹配词</th><th>命中动作</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.draft.map(r=>`<tr><td>${E(r.name)}</td><td>${r.nodes.map(stage).join('<br>')}</td><td>${E(r.keywords.join('、'))}</td><td>${r.action==='block'?'拦截':'仅记录'}</td><td>${A.badge(r.enabled?'启用':'停用',r.enabled?'blue':'gray')}</td><td><button class="link-btn" onclick="App.review.editRule('${r.id}')">编辑</button></td></tr>`).join('')}</tbody></table></div></section><section class="card section-gap"><div class="card-head"><h3>回归验证</h3>${valid?A.badge(`${test.rows.filter(r=>r.pass).length} / ${test.rows.length} 通过`,test.rows.every(r=>r.pass)?'green':'orange'):A.badge('待验证','gray')}</div>${valid?`<div class="table-wrap"><table><thead><tr><th>样本</th><th>预期</th><th>草稿结果</th><th>结论</th></tr></thead><tbody>${test.rows.map(r=>`<tr><td>${E(r.text)}</td><td>${r.expected==='block'?'拦截':'放行'}</td><td>${r.actual==='block'?'拦截':'放行'}</td><td>${A.badge(r.pass?'一致':r.expected==='block'?'漏拦截':'误拦截',r.pass?'green':'orange')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card-body muted">使用治理样本验证当前草稿</div>'}</section><section class="card section-gap"><div class="card-head"><h3>发布记录</h3></div><div class="table-wrap"><table><thead><tr><th>版本</th><th>发布时间</th><th>验证记录</th><th>操作</th></tr></thead><tbody>${d.versions.slice().reverse().map(v=>`<tr><td><button class="link-btn" onclick="App.review.viewVersion(${v.version})">v${v.version}</button> ${v.version===d.active?A.badge('当前使用','blue'):''}</td><td>${time(v.time)}</td><td>${E(v.note)}</td><td>${v.version!==d.active?`<button class="link-btn" onclick="App.review.rollback(${v.version})">使用此版本</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>${d.audit.length?`<div class="card-body muted">最近操作：${E(d.audit[0].action)} v${d.audit[0].version} · ${time(d.audit[0].time)}</div>`:''}</section>`;};
A.modules.review.render=function(){return A.heading('',{records:'审核记录',samples:'治理样本',rules:'规则治理',models:'模型管理'}[R.view],'',(R.view==='records'?'<button class="btn" onclick="App.review.simulate()">试用审核</button>':''))+(R.view==='records'?R.recordsHTML():R.view==='samples'?R.samplesHTML():R.view==='models'?A.connections.models():R.rulesHTML());};
})();

(function(){
'use strict';
const A=window.App,E=A.escape,I=A.icon;
const definitions={
 attack:{name:'攻防演练中心',icon:'activity',items:[['arena','攻防演练场','实时演练与回放','activity'],['tasks','任务管理','方案与执行记录','clock'],['banks','题库管理','题库与导入','file'],['models','模型管理','模型与智能体','box']]},
 review:{name:'内容审核中心',icon:'shield',sections:[{title:'工作台',items:[['records','审核记录','自动审核结果','file'],['samples','治理样本','回归与标注','layers'],['rules','规则治理','验证与版本','settings']]},{title:'系统配置',items:[['models','模型管理','模型连接配置','box']]}]},
 scan:{name:'漏洞扫描中心',icon:'code',items:[['tasks','扫描任务','创建与进度','activity'],['findings','漏洞处置','证据与复测','alert'],['assets','资产管理','扫描目标','layers'],['reports','扫描报告','结果与修复建议','file']]}
};
A.centers={
 accountToggle(){const menu=document.getElementById('center-user-menu'),button=document.getElementById('center-user-button');const open=menu.hidden;menu.hidden=!open;button.setAttribute('aria-expanded',String(open));},
 toggle(){A.data.ui ||= {};A.data.ui.sidebarCollapsed=!A.data.ui.sidebarCollapsed;A.save();A.centers.render();document.getElementById('center-toggle')?.focus();},
 current(){if(A.page==='attack')return A.attack.selected?'tasks':A.attack.tab;if(A.page==='review')return A.review.tab;if(A.page==='scan')return A.data.scan.tab==='overview'?'tasks':A.data.scan.tab||'tasks';return '';},
 count(id){if(A.page==='attack'&&id==='results')return A.attack.db.tasks.filter(t=>A.attack.metrics(t).done>0).length;if(A.page==='review'&&id==='inbox')return A.data.review.events.filter(e=>e.status==='pending').length;if(A.page==='scan'&&id==='findings')return A.data.scan.projects.reduce((n,p)=>n+p.findings.filter(f=>!['fixed','ignored'].includes(f.state)).length,0);return null;},
 go(id){A.closeModal();A.closeDrawer();if(A.page==='attack')A.attack.setTab(id);if(A.page==='review')A.review.setTab(id);if(A.page==='scan'){A.data.scan.tab=id;A.render();}window.scrollTo({top:0,behavior:'instant'});},
 render(){const def=definitions[A.page],host=document.getElementById('center-sidebar'),app=document.getElementById('app');app.classList.toggle('has-center-nav',!!def);app.classList.toggle('nav-collapsed',!!A.data.ui?.sidebarCollapsed);document.querySelector(def?'.top-actions':'.standalone-left').appendChild(document.getElementById('workspace-return'));if(!def){host.innerHTML='';return;}const current=A.centers.current(),item=(def.sections||[{items:def.items}]).flatMap(s=>s.items).find(n=>n[0]===current);host.innerHTML=`<div class="center-brand"><span class="center-mobile-mark">${I(def.icon,22)}</span><strong>${def.name}</strong><button id="center-toggle" class="center-toggle" onclick="App.centers.toggle()" aria-controls="center-navigation" aria-expanded="${!A.data.ui?.sidebarCollapsed}" aria-label="${A.data.ui?.sidebarCollapsed?'展开侧边栏':'收起侧边栏'}" title="${A.data.ui?.sidebarCollapsed?'展开侧边栏':'收起侧边栏'}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div><nav id="center-navigation" aria-label="${def.name}">${A.page==='attack'?`<button class="center-create ${current==='create'?'active':''}" onclick="App.attack.newTask()" aria-label="新建攻防任务" title="新建攻防任务">${I('plus',19)}<span>新建攻防任务</span></button>`:''}${(def.sections||[{title:'工作台',items:def.items}]).map(sec=>`<div class="center-section">${E(sec.title)}</div>${sec.items.map(([id,name,desc,icon])=>{const count=A.centers.count(id);return `<button class="center-nav-item ${current===id?'active':''}" onclick="App.centers.go('${id}')" aria-label="${name}" title="${name} · ${desc}" ${current===id?'aria-current="page"':''}><span class="center-nav-icon">${I(icon,17)}</span><span class="center-nav-text"><strong>${name}</strong><small>${desc}</small></span>${count?`<span class="center-nav-count">${count}</span>`:''}</button>`;}).join('')}`).join('')}</nav><div class="center-sidebar-bottom"><button id="center-user-button" onclick="App.centers.accountToggle()" class="center-account" aria-label="安全管理员" aria-expanded="false"><span class="avatar">安</span><span class="center-account-text"><strong>安全管理员</strong></span><span class="account-chevron">›</span></button><div id="center-user-menu" class="center-user-menu" hidden><button onclick="App.navigate('workspace')">${I('grid',14)}<span>回到首页</span></button></div></div>`;document.getElementById('current-crumb').innerHTML=`<span>${def.name}</span><span class="center-crumb-slash">/</span><strong>${E(item?.[1]||(current==='create'?'新建攻防任务':'工作台'))}</strong>`;document.title=`${item?.[1]||(current==='create'?'新建攻防任务':def.name)} · ${def.name}`;app.dataset.section=current;}
};
document.addEventListener('click',e=>{if(e.target.closest?.('.center-sidebar-bottom'))return;const m=document.getElementById('center-user-menu');if(m)m.hidden=true;document.getElementById('center-user-button')?.setAttribute('aria-expanded','false');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('center-user-menu');if(m)m.hidden=true;document.getElementById('center-user-button')?.setAttribute('aria-expanded','false');}});
const render=A.render;
A.render=function(){render();if(A.session)A.centers.render();};
})();

// Small shared demo utilities, independent of the three business modules.
App.resetDemo = function () {
  App.modal('恢复初始演示数据', '<p>清除当前浏览器中新增的演示任务、对象、治理样本和规则版本，重新载入初始样例</p><p class="hint">只影响这个 Demo 的本地数据，不会修改项目文件</p>', '<button class="btn" onclick="App.closeModal()">保留当前数据</button><button class="btn danger" onclick="App.confirmResetDemo()">恢复初始样例</button>');
};
App.confirmResetDemo = function () {
  try { localStorage.removeItem('zhian-standalone-review'); location.hash = 'workspace'; location.reload(); }
  catch (e) { App.toast('浏览器不允许清理本地存储，请重新打开页面'); }
};
